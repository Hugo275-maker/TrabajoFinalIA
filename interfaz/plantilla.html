<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatrullaIA · Patrullaje en Lima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root {
  --tinta: #132238;
  --tinta-2: #4b5d73;
  --tinta-3: #7b8a9b;
  --plano: #e4eaee;
  --papel: #f6f8f9;
  --linea: #c9d2da;
  --ruta: #0b3fd1;
  --critico: #ae2012;
  --ambar: #ee9b00;
  --r0: #c3cdd6; --r1: #e3cf8f; --r2: #eeab2b; --r3: #d9731a; --r4: #ae2012;
  --ancho-riel: 232px;
  --ancho-panel: 400px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Archivo", system-ui, "Segoe UI", sans-serif;
  font-stretch: 100%;
  color: var(--tinta);
  background: var(--plano);
  font-size: 15px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ruta); outline-offset: 2px; }

.app { display: grid; grid-template-columns: var(--ancho-riel) minmax(0, 1fr) var(--ancho-panel); height: 100vh; }

/* Riel: las cuatro etapas del agente, en orden */
.riel { background: var(--tinta); color: #eef2f5; display: flex; flex-direction: column; padding: 22px 0 16px; }
.marca { padding: 0 22px 20px; }
.marca h1 { margin: 0; font-size: 30px; font-weight: 800; font-stretch: 68%; letter-spacing: 0.005em; line-height: 1; }
.marca p { margin: 8px 0 0; font-size: 13px; color: #a9b7c6; line-height: 1.35; }
.etapas { list-style: none; margin: 0; padding: 0; counter-reset: etapa; }
.etapas button {
  counter-increment: etapa; width: 100%; text-align: left; background: none; border: 0;
  padding: 13px 22px 13px 58px; position: relative; color: #c5d0db; border-left: 4px solid transparent;
}
.etapas button::before {
  content: counter(etapa); position: absolute; left: 20px; top: 12px; width: 26px; height: 26px;
  border: 1.5px solid #5b6f86; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; color: #a9b7c6;
}
.etapas li + li button::after { content: ""; position: absolute; left: 32.5px; top: -14px; height: 26px; border-left: 1.5px solid #3b4d63; }
.etapas b { display: block; font-size: 17px; font-weight: 700; font-stretch: 82%; color: #eef2f5; }
.etapas span { display: block; font-size: 12.5px; color: #93a3b5; margin-top: 1px; }
.etapas button:hover { background: #1b2e48; }
.etapas button[aria-current="true"] { background: #1f3553; border-left-color: var(--ambar); }
.etapas button[aria-current="true"]::before { background: var(--ambar); border-color: var(--ambar); color: var(--tinta); }
.pie { margin-top: auto; padding: 16px 22px 0; font-size: 12px; color: #8494a6; line-height: 1.4; }

/* Mapa */
.lienzo { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.lienzo canvas, .lienzo svg.lima { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lienzo canvas { touch-action: none; cursor: grab; }
.lienzo canvas.arrastrando { cursor: grabbing; }
.lienzo::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(rgba(228,234,238,.96) 45%, rgba(228,234,238,0)); z-index: 1; pointer-events: none; }
.rotulo, .leyenda, .controles, .zoom { z-index: 2; }
.rotulo { position: absolute; left: 24px; top: 20px; right: 24px; pointer-events: none; }
.rotulo h2 { margin: 0; font-size: 34px; font-weight: 800; font-stretch: 66%; line-height: 1.02; max-width: 18ch; }
.rotulo p { margin: 6px 0 0; font-size: 14px; color: var(--tinta-2); max-width: 46ch; }
.controles { position: absolute; left: 24px; bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grupo { display: inline-flex; background: var(--papel); border: 1px solid var(--linea); border-radius: 6px; overflow: hidden; }
.grupo button { border: 0; background: none; padding: 8px 13px; font-size: 14px; font-weight: 600; font-stretch: 88%; border-right: 1px solid var(--linea); }
.grupo button:last-child { border-right: 0; }
.grupo button[aria-pressed="true"] { background: var(--tinta); color: #fff; }
.grupo button:disabled { color: var(--tinta-3); cursor: not-allowed; }
.zoom { position: absolute; right: 16px; bottom: 20px; display: flex; flex-direction: column; }
.zoom .grupo { flex-direction: column; }
.zoom button { border-right: 0; border-bottom: 1px solid var(--linea); width: 38px; padding: 7px 0; font-size: 18px; line-height: 1; }
.zoom button:last-child { border-bottom: 0; font-size: 12px; padding: 9px 0; }
.leyenda { position: absolute; right: 16px; top: 20px; background: rgba(246,248,249,.94); border: 1px solid var(--linea); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; color: var(--tinta-2); }
.leyenda strong { display: block; color: var(--tinta); font-size: 13px; margin-bottom: 6px; }
.rampa { height: 10px; width: 150px; border-radius: 2px; }
.rampa-ejes { display: flex; justify-content: space-between; margin-top: 3px; }
.leyenda ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.leyenda li { display: flex; align-items: center; gap: 7px; }
.sim { width: 22px; height: 0; border-top: 4px solid var(--ruta); flex: none; }
.sim.corta { border-top: 3px dashed #5b6b7e; }
.sim.punto { width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--critico); margin: 0 4.5px; }
.sim.carro { width: 20px; height: 10px; border: 1.5px solid var(--tinta); border-radius: 3px; background: linear-gradient(90deg, #fdfdfd 38%, #e22626 38% 50%, #1e5aff 50% 62%, #fdfdfd 62%); margin: 0 1px; }
.sim.comi { width: 12px; height: 12px; border: 0; background: var(--tinta); margin: 0 5px; }
.marcador { position: absolute; left: 24px; bottom: 70px; z-index: 2; background: var(--tinta); color: #dfe7ee; padding: 8px 13px; border-radius: 6px; font-size: 14px; display: flex; align-items: baseline; gap: 6px; }
.marcador[hidden] { display: none; }
.marcador b { color: #fff; font-size: 19px; font-weight: 800; font-stretch: 78%; }
.marcador span { width: 1px; align-self: stretch; background: #4b5d73; margin: 0 6px; }
.globo { position: absolute; pointer-events: none; background: var(--tinta); color: #fff; padding: 6px 9px; border-radius: 4px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -130%); display: none; z-index: 5; }
.globo b { font-weight: 700; }
svg.lima path { stroke: var(--plano); stroke-width: 1; cursor: pointer; vector-effect: non-scaling-stroke; }
svg.lima path:hover { stroke: var(--tinta); stroke-width: 1.5; }
svg.lima path.sel { stroke: var(--ambar); stroke-width: 3; }

/* Panel de lectura */
.panel { background: var(--papel); border-left: 1px solid var(--linea); overflow-y: auto; padding: 22px 22px 40px; min-height: 0; }
.panel h3 { margin: 0 0 2px; font-size: 24px; font-weight: 800; font-stretch: 72%; line-height: 1.1; }
.panel h4 { margin: 26px 0 8px; font-size: 16px; font-weight: 700; font-stretch: 84%; padding-top: 14px; border-top: 1px solid var(--linea); }
.panel p { margin: 6px 0; color: var(--tinta-2); font-size: 14px; }
.sub { color: var(--tinta-2); font-size: 13.5px; margin: 0; }
.cifras { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 14px 0 4px; }
.cifra b { display: block; font-size: 30px; font-weight: 800; font-stretch: 74%; line-height: 1; }
.cifra span { display: block; font-size: 12.5px; color: var(--tinta-2); margin-top: 4px; line-height: 1.3; }
.cifra em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--tinta-2); margin-left: 4px; }
.aviso { border-left: 4px solid var(--ambar); background: #fbf3df; padding: 9px 12px; font-size: 13.5px; color: #4a3a12; margin: 12px 0; }
.aviso b { color: #2f2408; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: right; font-weight: 600; color: var(--tinta-2); padding: 4px 0 6px 8px; border-bottom: 1px solid var(--linea); font-size: 12.5px; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td { text-align: right; padding: 6px 0 6px 8px; border-bottom: 1px solid #e3e8ec; }
td.mejor { font-weight: 800; }
td.mejor::after { content: " ●"; color: var(--ambar); font-size: 10px; vertical-align: 2px; }
.lista { list-style: none; margin: 0; padding: 0; }
.lista button { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; width: 100%; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid #e3e8ec; padding: 6px 0; font-size: 13.5px; }
.lista button:hover { background: #eaeff2; }
.lista button[aria-pressed="true"] { font-weight: 700; box-shadow: inset 3px 0 0 var(--ambar); padding-left: 8px; }
.lista i { font-style: normal; color: var(--tinta-3); font-size: 12px; }
.lista .barra { grid-column: 2 / 4; height: 4px; background: #dfe5ea; margin-top: -2px; }
.lista .barra u { display: block; height: 100%; background: var(--tinta); }
.barras { display: grid; gap: 9px; margin-top: 6px; }
.barras div { font-size: 13.5px; }
.barras .fila { display: flex; justify-content: space-between; gap: 8px; }
.barras .pista { height: 9px; background: #dfe5ea; margin-top: 3px; }
.barras .pista u { display: block; height: 100%; background: var(--tinta); min-width: 1px; }
.barras .pista u.dest { background: var(--ruta); }
.barras .cero { color: var(--tinta-3); }
.grafico { width: 100%; height: auto; display: block; margin-top: 6px; overflow: visible; }
.grafico text { font-size: 11px; fill: var(--tinta-2); font-family: inherit; }
.orden { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; font-size: 13px; margin: 6px 0 0; padding: 0; list-style: none; }
.orden li { display: flex; align-items: center; }
.orden li::after { content: "›"; margin: 0 4px; color: var(--tinta-3); }
.orden li:last-child::after { content: ""; }
.orden .p { width: 22px; height: 22px; border-radius: 50%; background: var(--critico); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.orden .c { background: var(--tinta); color: #fff; padding: 2px 7px; font-weight: 600; font-size: 12px; }
.deslizador { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; margin: 12px 0; }
.deslizador label { grid-column: 1 / 3; font-size: 13.5px; color: var(--tinta-2); }
.deslizador input { width: 100%; accent-color: var(--tinta); }
.deslizador output { font-size: 22px; font-weight: 800; font-stretch: 74%; }
.accion { background: var(--tinta); color: #fff; border: 0; border-radius: 6px; padding: 9px 14px; font-weight: 700; font-stretch: 88%; font-size: 14px; }
.accion:hover { background: #20395b; }
.nota { font-size: 12.5px; color: var(--tinta-3); margin-top: 22px; }

@media (max-width: 1100px) {
  :root { --ancho-panel: 340px; --ancho-riel: 200px; }
  .rotulo h2 { font-size: 28px; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 62vh auto; height: auto; }
  .riel { padding: 14px 0 0; }
  .marca { padding: 0 16px 10px; }
  .marca p, .pie { display: none; }
  .etapas { display: grid; grid-template-columns: repeat(4, 1fr); }
  .etapas button { padding: 8px 6px 10px; text-align: center; border-left: 0; border-bottom: 4px solid transparent; }
  .etapas button::before { position: static; margin: 0 auto 4px; }
  .etapas li + li button::after { display: none; }
  .etapas b { font-size: 14px; }
  .etapas span { display: none; }
  .etapas button[aria-current="true"] { border-bottom-color: var(--ambar); }
  .panel { border-left: 0; border-top: 1px solid var(--linea); overflow: visible; }
  .leyenda { display: none; }
  .lienzo::before { height: 80px; }
  .rotulo { left: 16px; top: 14px; }
  .controles { left: 12px; right: 12px; bottom: 12px; }
  .grupo button { padding: 8px 10px; font-size: 13px; }
  .zoom { bottom: auto; top: 60px; right: 12px; }
  .marcador { left: 12px; bottom: 104px; font-size: 13px; padding: 6px 10px; }
  .marcador b { font-size: 16px; }
  .rotulo h2 { font-size: 24px; }
  .rotulo p { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="riel" aria-label="Etapas del agente">
    <div class="marca">
      <h1>PatrullaIA</h1>
      <p>Dónde y por dónde patrullar en Lima Metropolitana</p>
    </div>
    <ol class="etapas" id="etapas">
      <li><button data-etapa="prediccion"><b>Predecir</b><span>Denuncias del próximo mes</span></button></li>
      <li><button data-etapa="asignacion"><b>Repartir</b><span>Patrullas por distrito</span></button></li>
      <li><button data-etapa="riesgo"><b>Estimar riesgo</b><span>Calle por calle</span></button></li>
      <li><button data-etapa="rutas"><b>Trazar ruta</b><span>Desde la comisaría</span></button></li>
    </ol>
    <p class="pie" id="pie"></p>
  </nav>

  <main class="lienzo" id="lienzo">
    <svg class="lima" id="lima" role="img" aria-label="Mapa de los 43 distritos de Lima"></svg>
    <canvas id="calles" aria-label="Mapa de calles del distrito piloto"></canvas>
    <div class="rotulo"><h2 id="titulo"></h2><p id="bajada"></p></div>
    <div class="leyenda" id="leyenda"></div>
    <div class="controles" id="controles"></div>
    <div class="zoom" id="zoom"><div class="grupo">
      <button data-zoom="1" aria-label="Acercar">+</button>
      <button data-zoom="-1" aria-label="Alejar">−</button>
      <button data-zoom="0" aria-label="Ver todo">Todo</button>
    </div></div>
    <div class="marcador" id="marcador" hidden></div>
    <div class="globo" id="globo"></div>
  </main>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script>
const D = /*__DATOS__*/null;

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const num = (v, dec = 0) => {
  const [e, d] = Math.abs(v).toFixed(dec).split(".");
  return (v < 0 ? "−" : "") + e.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (d ? "," + d : "");
};
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "setiembre", "octubre", "noviembre", "diciembre"];
const mesTexto = (ym) => MESES[+ym.slice(5) - 1] + " de " + ym.slice(0, 4);
const mezcla = (a, b, t) => {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")";
};
const rampaAzul = (t) => t < 0.5 ? mezcla("#dbe5ec", "#6d8fb3", t * 2) : mezcla("#6d8fb3", "#132238", (t - 0.5) * 2);
const RIESGO = ["#c3cdd6", "#e3cf8f", "#eeab2b", "#d9731a", "#ae2012"];
const sinMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;

const estado = { etapa: "prediccion", distrito: "150101", piloto: "150101", beta: "2", metodo: "proporcional", n: 100 };
D.distritos.forEach((d) => { if (d.ubigeo === "150101") d.nombre = "Cercado de Lima"; });
const porUbigeo = Object.fromEntries(D.distritos.map((d) => [d.ubigeo, d]));
const ultimo = (d) => d.serie[d.serie.length - 1];
const NOMBRE_PILOTO = { "150101": "Cercado de Lima", "150132": "San Juan de Lurigancho" };

/* ---------- reparto de patrullas (líneas base) ---------- */
function repartoParejo(n) {
  const base = Math.floor(n / 43), resto = n - base * 43;
  return Object.fromEntries(D.distritos.map((d, i) => [d.ubigeo, base + (i < resto ? 1 : 0)]));
}
function repartoProporcional(n) {
  // 1 patrulla mínima por distrito; el resto, proporcional a las denuncias del último mes (mayor residuo)
  const libres = n - 43, total = D.distritos.reduce((s, d) => s + ultimo(d), 0);
  const cuotas = D.distritos.map((d) => ({ u: d.ubigeo, q: libres * ultimo(d) / total }));
  const r = Object.fromEntries(cuotas.map((c) => [c.u, 1 + Math.floor(c.q)]));
  let faltan = n - Object.values(r).reduce((a, b) => a + b, 0);
  cuotas.sort((a, b) => (b.q % 1) - (a.q % 1)).slice(0, faltan).forEach((c) => r[c.u]++);
  return r;
}
const METODOS = [
  ["parejo", "Parejo", "Parejo (igual para todos)"],
  ["proporcional", "Proporcional", "Proporcional al mes anterior"],
  ["renamu", "Actual (RENAMU)", "Actual según RENAMU 2026"],
  ["ga", "Algoritmo genético", "Algoritmo genético"],
];
function repartos() {
  if (D.reparto) return { n: D.reparto.n, ...D.reparto.metodos };
  const n = estado.n;
  return { n, parejo: repartoParejo(n), proporcional: repartoProporcional(n), renamu: null, ga: null };
}
function cobertura(x) {
  // misma función de aptitud del 04_ga: % de denuncias esperadas cubiertas
  const a = D.reparto ? D.reparto.alpha : 0.45;
  let num_ = 0, den = 0;
  D.distritos.forEach((d) => { num_ += d.pred * (1 - Math.exp(-a * x[d.ubigeo] / d.area)); den += d.pred; });
  return (num_ / den) * 100;
}
function graficoConvergencia(c) {
  const W = 356, H = 150, m = { i: 34, d: 8, a: 10, b: 24 }, n = c.mejor.length;
  const todos = [...c.mejor, ...c.promedio, ...Object.values(D.reparto.cobertura)];
  const lo = Math.floor(Math.min(...todos) / 5) * 5, hi = Math.ceil(Math.max(...todos) / 5) * 5;
  const x = (i) => m.i + (i / (n - 1)) * (W - m.i - m.d), y = (v) => H - m.b - ((v - lo) / (hi - lo)) * (H - m.a - m.b);
  const linea = (s) => s.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join("");
  const ref = (v, t) => `<line x1="${m.i}" x2="${W - m.d}" y1="${y(v)}" y2="${y(v)}" stroke="#9aa8b6" stroke-dasharray="3 3"/><text x="${W - m.d}" y="${y(v) - 3}" text-anchor="end">${t}</text>`;
  const marcas = [lo, (lo + hi) / 2, hi].map((v) => `<text x="${m.i - 5}" y="${y(v) + 4}" text-anchor="end">${num(v)} %</text>`).join("");
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Convergencia del algoritmo genético">
    ${marcas}${ref(D.reparto.cobertura.renamu, "actual (RENAMU)")}${ref(D.reparto.cobertura.proporcional, "proporcional")}
    <path d="${linea(c.promedio)}" fill="none" stroke="#9aa8b6" stroke-width="1.4"/>
    <path d="${linea(c.mejor)}" fill="none" stroke="#0b3fd1" stroke-width="2.2"/>
    <text x="${m.i}" y="${H - 6}">1</text><text x="${W - m.d}" y="${H - 6}" text-anchor="end">${n} generaciones</text>
  </svg>
  <p class="sub">Azul: mejor reparto de cada generación. Gris: promedio de la población.</p>`;
}

/* ---------- mapa de Lima (SVG) ---------- */
const lima = $("#lima");
const LIMA = (() => {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  D.distritos.forEach((d) => d.forma.forEach((a) => a.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); })));
  const k = Math.cos(((y0 + y1) / 2) * Math.PI / 180), alto = 1000, ancho = alto * ((x1 - x0) * k) / (y1 - y0);
  const px = ([x, y]) => [((x - x0) / (x1 - x0)) * ancho, (1 - (y - y0) / (y1 - y0)) * alto];
  return { ancho, alto, px };
})();
function construirLima() {
  // margen superior para el rótulo y lateral para respirar
  lima.setAttribute("viewBox", `${-LIMA.ancho * 0.5} -105 ${LIMA.ancho * 2} ${LIMA.alto + 130}`);
  lima.setAttribute("preserveAspectRatio", "xMidYMid meet");
  lima.innerHTML = D.distritos.map((d) => {
    const ruta = d.forma.map((a) => "M" + a.map((p) => LIMA.px(p).map((v) => v.toFixed(1)).join(",")).join("L") + "Z").join("");
    return `<path d="${ruta}" data-u="${d.ubigeo}"></path>`;
  }).join("");
  lima.addEventListener("click", (e) => { const u = e.target.dataset && e.target.dataset.u; if (u) { estado.distrito = u; pintar(); } });
  lima.addEventListener("mousemove", (e) => {
    const u = e.target.dataset && e.target.dataset.u; if (!u) return ocultarGlobo();
    const d = porUbigeo[u], r = $("#lienzo").getBoundingClientRect();
    const texto = estado.etapa === "prediccion" ? `${num(d.pred)} denuncias esperadas` : `${valorReparto(u)} patrullas`;

  ${minimos.length ? `<div class="aviso"><b>${minimos.length} distritos reciben solo 1 patrulla.</b> Son distritos muy extensos para sus denuncias, como ${minimos.sort((a, b) => b.pred - a.pred).slice(0, 2).map((x) => x.nombre).join(" y ")}: ahí una patrulla cubre poco por km², así que el algoritmo las manda donde cubren más.</div>` : ""}
  <h4>Todos los distritos</h4>
  <table><thead><tr><th>Distrito</th>${disponibles.map(([k, corto]) => `<th>${{ parejo: "Parejo", proporcional: "Proporc.", renamu: "Actual", ga: "Genético" }[k]}</th>`).join("")}</tr></thead><tbody>
  ${orden.map((x) => `<tr><td><button data-u="${x.ubigeo}" style="background:none;border:0;padding:0;text-align:left;${x.ubigeo === d.ubigeo ? "font-weight:800" : ""}">${x.nombre}</button></td>${disponibles.map(([k]) => `<td>${r[k][x.ubigeo]}</td>`).join("")}</tr>`).join("")}
  </tbody></table>
  <p class="nota">Cobertura de un distrito: 1 − e<sup>−α·p/A</sup>, con p patrullas, A su área en km² y α = ${num(D.reparto ? D.reparto.alpha : 0.45, 2)}. El total pondera cada distrito por sus denuncias esperadas.</p>`;
}
function panelRiesgo() {
  const p = D.pilotos[estado.piloto], max = Math.max(...D.pesos.map((x) => x.peso)), v = D.validacion_riesgo;
  let alto = 0, total = 0; for (let i = 4; i < p.calles.length; i += 5) { total++; if (p.calles[i] > 50) alto++; }
  return `<h3>${NOMBRE_PILOTO[estado.piloto]}</h3><p class="sub">${num(p.tramos)} tramos de calle y ${num(p.esquinas)} esquinas</p>
  <div class="cifras">
    <div class="cifra"><b>${num((alto / total) * 100, 1)} %</b><span>de los tramos tiene riesgo mayor que 0,5</span></div>
    <div class="cifra"><b>${p.puntos.length}</b><span>puntos críticos, separados más de 300 m</span></div>
  </div>
  <h4>Qué lugares suman riesgo a una calle</h4>
  <p class="sub">Peso de cada lugar a menos de 100 m, ajustado con descenso del gradiente para que el riesgo de cada distrito se parezca a sus denuncias reales.</p>
  <div class="barras">${D.pesos.map((x) => `<div class="${x.peso === 0 ? "cero" : ""}"><div class="fila"><span>${x.factor}</span><b>${x.peso === 0 ? "0" : num(x.peso, 3)}</b></div><div class="pista"><u style="width:${(x.peso / max) * 100}%"></u></div></div>`).join("")}</div>
  <div class="aviso"><b>Bares y cercanía a la policía quedaron con peso 0.</b> Con los datos de OpenStreetMap no ayudan a explicar las denuncias por distrito.</div>
  <h4>¿Aporta más que contar calles?</h4>
  <p class="sub">Prueba dejando un distrito fuera, 43 veces.</p>
  <table><thead><tr><th>Modelo</th><th>MAE</th><th>MAPE (%)</th><th>R²</th></tr></thead><tbody>
    <tr><td>Solo cantidad de calles</td><td>${num(v.base.MAE, 1)}</td><td>${num(v.base.MAPE, 0)}</td><td>${num(v.base.R2, 2)}</td></tr>
    <tr><td>Con lugares de OSM</td><td class="mejor">${num(v.completo.MAE, 1)}</td><td class="mejor">${num(v.completo.MAPE, 0)}</td><td class="mejor">${num(v.completo.R2, 2)}</td></tr>
  </tbody></table>
  <h4>Puntos críticos</h4>
  <table><thead><tr><th>Punto</th><th>Riesgo sin recortar</th></tr></thead><tbody>${p.puntos.map((q) => `<tr><td>Punto ${q.n}</td><td>${num(q.riesgo, 2)}</td></tr>`).join("")}</tbody></table>
  <p class="nota">El riesgo es estimado, no observado: las denuncias solo indican el distrito, no la calle.</p>`;
}
function panelRutas() {
  const p = D.pilotos[estado.piloto], r = p.rutas[estado.beta], r0 = p.rutas["0"];
  const maxN = Math.max(...p.algoritmos.map((a) => a.nodos)), extra = ((r.km - r0.km) / r0.km) * 100;
  const nombres = { "A*": "A*", "A* sin heurística (Dijkstra)": "A* sin heurística", "BFS": "BFS" };
  return `<h3>${NOMBRE_PILOTO[estado.piloto]}</h3><p class="sub">Sale de la ${p.comisaria.nombre}, visita los ${p.puntos.length} puntos críticos y vuelve.</p>
  <div class="cifras">
    <div class="cifra"><b>${num(r.km, 1)} km</b><span>${estado.beta === "0" ? "la ruta más corta posible" : `${num(extra, 1)} % más larga que la ruta más corta`}</span></div>
    <div class="cifra"><b>${num(r.pct_alto, 0)} %<em>${estado.beta === "0" ? "" : (r.pct_alto - r0.pct_alto >= 0 ? "+" : "") + num(r.pct_alto - r0.pct_alto, 0)}</em></b><span>del recorrido pasa por calles de riesgo alto${estado.beta === "0" ? "" : " (cambio frente a β = 0)"}</span></div>
  </div>
  <p>β indica cuánto prefiere la patrulla las calles riesgosas. Con β = 0 busca solo la ruta más corta.</p>
  <button class="accion" id="recorrer">Recorrer la ruta otra vez</button>
  <h4>Orden de visita</h4>
  <ol class="orden"><li><span class="c">Comisaría</span></li>${r.orden.map((_, i) => `<li><span class="p">${i + 1}</span></li>`).join("")}<li><span class="c">Comisaría</span></li></ol>
  <p class="sub">Se probaron los 40 320 órdenes posibles y se eligió el de menor costo.</p>
  <h4>Efecto de β en este distrito</h4>
  <table><thead><tr><th>β</th><th>km</th><th>Riesgo medio</th><th>% en riesgo alto</th></tr></thead><tbody>
  ${D.betas.map((b) => `<tr><td style="${b === estado.beta ? "font-weight:800" : ""}">β = ${b}</td><td>${num(p.rutas[b].km, 2)}</td><td>${num(p.rutas[b].riesgo_medio, 2)}</td><td>${num(p.rutas[b].pct_alto, 1)}</td></tr>`).join("")}
  </tbody></table>
  <h4>Esquinas revisadas por cada algoritmo</h4>
  <p class="sub">Mismo recorrido con β = 2. Menos es mejor.</p>
  <div class="barras">${p.algoritmos.map((a) => `<div><div class="fila"><span>${nombres[a.nombre] || a.nombre}, ${num(a.km, 2)} km</span><b>${num(a.nodos)}</b></div><div class="pista"><u class="${a.nombre === "A*" ? "dest" : ""}" style="width:${(a.nodos / maxN) * 100}%"></u></div></div>`).join("")}</div>
  <p class="nota">BFS encuentra el camino con menos tramos, no el más corto. A* y A* sin heurística (Dijkstra) dan la misma ruta; la heurística hace que A* revise menos esquinas.</p>`;
}

/* ---------- pintar todo ---------- */
const TEXTOS = {
  prediccion: ["Denuncias esperadas en " + mesTexto(D.mes_prediccion), "Robo y hurto por distrito, según la red neuronal (MLP). Toca un distrito para ver su historia."],
  asignacion: ["Patrullas por distrito", "Cuántas patrullas recibe cada distrito con cada forma de repartir."],
  riesgo: ["Riesgo de cada calle", "Estimado con los lugares de OpenStreetMap cercanos a cada tramo."],
  rutas: ["Ruta de la patrulla", "Calculada con A* sobre la red de calles, prefiriendo los tramos de mayor riesgo."],
};
function pintar() {
  const e = estado.etapa, enLima = e === "prediccion" || e === "asignacion";
  document.querySelectorAll("#etapas button").forEach((b) => b.setAttribute("aria-current", b.dataset.etapa === e));
  $("#titulo").textContent = TEXTOS[e][0]; $("#bajada").textContent = TEXTOS[e][1];
  lima.style.display = enLima ? "block" : "none"; lienzoCalles.style.display = enLima ? "none" : "block"; $("#zoom").style.display = enLima ? "none" : "flex";
  const btn = (grupo, valor, texto, activo, extra = "") => `<button data-${grupo}="${valor}" aria-pressed="${activo}" ${extra}>${texto}</button>`;
  const pilotos = `<div class="grupo" role="group" aria-label="Distrito piloto">${Object.keys(D.pilotos).map((u) => btn("piloto", u, NOMBRE_PILOTO[u], u === estado.piloto)).join("")}</div>`;
  if (enLima) {
    const { min, max } = pintarLima();
    const tope = e === "prediccion" ? num(max) : max, piso = e === "prediccion" ? num(min) : min;
    $("#leyenda").innerHTML = `<strong>${e === "prediccion" ? "Denuncias esperadas" : "Patrullas"}</strong><div class="rampa" style="background:linear-gradient(90deg,#dbe5ec,#6d8fb3,#132238)"></div><div class="rampa-ejes"><span>${piso}</span><span>${tope}</span></div>`;
    $("#controles").innerHTML = e === "asignacion" ? `<div class="grupo" role="group" aria-label="Forma de repartir">${METODOS.map(([k, corto]) => btn("metodo", k, corto, estado.metodo === k, repartos()[k] ? "" : "disabled")).join("")}</div>` : "";
  } else {
    $("#leyenda").innerHTML = `<strong>Riesgo del tramo</strong><div class="rampa" style="background:linear-gradient(90deg,${RIESGO.join(",")})"></div><div class="rampa-ejes"><span>0</span><span>1</span></div>
      <ul>${e === "rutas" ? `<li><span class="sim"></span>Ruta con β = ${estado.beta}</li>${estado.beta !== "0" ? `<li><span class="sim corta"></span>Ruta más corta (β = 0)</li>` : ""}<li><span class="sim comi"></span>Comisaría</li><li><span class="sim carro"></span>Patrullero en recorrido</li><li><span class="sim punto"></span>Punto crítico, en orden de visita</li>` : `<li><span class="sim punto"></span>Punto crítico, del más al menos riesgoso</li>`}</ul>`;
    $("#controles").innerHTML = pilotos + (e === "rutas" ? `<div class="grupo" role="group" aria-label="Valor de beta">${D.betas.map((b) => btn("beta", b, "β = " + b, b === estado.beta)).join("")}</div>` : "");
    dibujarCalles();
  }
  const panel = $("#panel"), arriba = panel.scrollTop;
  panel.innerHTML = { prediccion: panelPrediccion, asignacion: panelAsignacion, riesgo: panelRiesgo, rutas: panelRutas }[e]();
  panel.scrollTop = panel.dataset.etapa === e ? arriba : 0; panel.dataset.etapa = e;
}
function irA(etapa, desdeHash) {
  if (!TEXTOS[etapa]) etapa = "prediccion";
  estado.etapa = etapa;
  if (!desdeHash) { try { history.replaceState(null, "", "#" + etapa); } catch (_) { location.hash = etapa; } }
  cancelAnimationFrame(anim); $("#marcador").hidden = true;
  if (etapa === "riesgo" || etapa === "rutas") { lienzoCalles.style.display = "block"; encuadrar(); progreso = 1; }
  pintar();
  if (etapa === "rutas") recorrer();
}

$("#etapas").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) irA(b.dataset.etapa); });
$("#controles").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.piloto) { estado.piloto = b.dataset.piloto; encuadrar(); progreso = 1; pintar(); if (estado.etapa === "rutas") recorrer(); }
  else if (b.dataset.beta) { estado.beta = b.dataset.beta; pintar(); recorrer(); }
  else if (b.dataset.metodo) { estado.metodo = b.dataset.metodo; pintar(); }
});
$("#panel").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.u) { estado.distrito = b.dataset.u; pintar(); }
  else if (b.id === "recorrer") recorrer();
});
$("#panel").addEventListener("input", (e) => {
  if (e.target.id !== "n") return;
  estado.n = +e.target.value; $("#nSalida").textContent = estado.n; pintarLima();
});
$("#panel").addEventListener("change", (e) => { if (e.target.id === "n") { pintar(); const n = $("#n"); if (n) n.focus(); } });
addEventListener("hashchange", () => irA(location.hash.slice(1), true));
addEventListener("resize", () => { if (estado.etapa === "riesgo" || estado.etapa === "rutas") { encuadrar(); dibujarCalles(); } });

$("#pie").textContent = `Datos: MININTER (ene 2018 – jul 2026), RENAMU 2026 (INEI) y OpenStreetMap. Apoyo a la decisión: no reemplaza el criterio de la policía ni del serenazgo. Generado el ${D.generado}.`;
if (D.reparto) estado.metodo = "ga";
construirLima();
irA(location.hash.slice(1) || "prediccion", true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (estado.etapa === "riesgo" || estado.etapa === "rutas") dibujarCalles(); });
</script>
</body>
</html>
